name: refresh funds snapshot

on:
  workflow_dispatch:
  schedule:
    # 09:55, 13:30 and 23:55 Europe/Istanbul (UTC+3), weekdays.
    - cron: "55 6 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "55 20 * * 1-5"

permissions: {}

concurrency:
  group: funds-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIN_API_BASE_URL: https://grknsytrk-fin-api.hf.space
      FIN_API_ADMIN_TOKEN: ${{ secrets.FIN_API_ADMIN_TOKEN }}
      FIN_MAX_SNAPSHOT_AGE_DAYS: "5"
    steps:
      - name: request refresh job
        id: request
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 5 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $FIN_API_ADMIN_TOKEN" \
            "$FIN_API_BASE_URL/admin/funds/refresh-snapshot?lookback_days=14")"
          job_id="$(echo "$response" | jq -r '.refresh_job.job_id // empty')"
          if [[ -z "$job_id" ]]; then
            echo "refresh endpoint did not return a job id" >&2
            exit 1
          fi
          echo "refresh requested: job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: wait for refresh result
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 5 --max-time 20 \
              -H "Authorization: Bearer $FIN_API_ADMIN_TOKEN" \
              "$FIN_API_BASE_URL/admin/funds/refresh-snapshot/status?job_id=$JOB_ID")"
            status="$(echo "$response" | jq -r '.refresh_job.status // empty')"
            resolution="$(echo "$response" | jq -r '.refresh_job.resolution_status // empty')"
            as_of="$(echo "$response" | jq -r '.refresh_job.resolved_as_of // .refresh_job.as_of // empty')"
            echo "refresh status: job_id=$JOB_ID status=$status resolution=${resolution:-unknown} as_of=${as_of:-unknown}"
            case "$status" in
              succeeded)
                if [[ ! "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                  echo "refresh succeeded without a valid snapshot as_of date" >&2
                  exit 1
                fi
                as_of_epoch="$(date -u -d "$as_of" +%s)"
                now_epoch="$(date -u +%s)"
                max_age_seconds="$((FIN_MAX_SNAPSHOT_AGE_DAYS * 86400))"
                if (( now_epoch - as_of_epoch > max_age_seconds )); then
                  echo "refresh completed but snapshot is older than ${FIN_MAX_SNAPSHOT_AGE_DAYS} days: $as_of" >&2
                  exit 1
                fi
                echo "refresh succeeded: $resolution"
                exit 0
                ;;
              failed)
                echo "refresh failed: $resolution" >&2
                exit 1
                ;;
              superseded)
                echo "refresh was superseded by a newer generation; existing snapshot remains authoritative"
                exit 0
                ;;
            esac
            sleep 20
          done
          echo "refresh job did not finish within 30 minutes" >&2
          exit 1
