name: refresh funds snapshot

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes on weekdays in Europe/Istanbul (UTC+3).
    # GitHub Actions evaluates cron in UTC, so the day boundary needs two ranges.
    - cron: "*/30 0-20 * * 1-5"
    - cron: "*/30 21-23 * * 0-4"

permissions: {}

concurrency:
  group: funds-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIN_API_BASE_URL: https://grknsytrk-fin-api.hf.space
      FIN_API_ADMIN_TOKEN: ${{ secrets.FIN_API_ADMIN_TOKEN }}
      FIN_MAX_SNAPSHOT_AGE_DAYS: "5"
    steps:
      - name: wake api
        shell: bash
        run: |
          set -euo pipefail
          # A free CPU Space can be asleep when the schedule fires, and a cold
          # boot takes far longer than a short request timeout. Wake it first so
          # a failed refresh always means a real API or auth problem.
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 60 \
            "$FIN_API_BASE_URL/health" > /dev/null

      - name: request refresh job
        id: request
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          # The endpoint returns the active job for concurrent requests, so a
          # retry after a dropped connection cannot start a second refresh.
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $FIN_API_ADMIN_TOKEN" \
            "$FIN_API_BASE_URL/admin/funds/refresh-snapshot?lookback_days=5")" || status="000"
          if [[ "$status" != "200" ]]; then
            echo "refresh request failed: HTTP $status" >&2
            cat "$body" >&2 || true
            exit 1
          fi
          job_id="$(jq -r '.refresh_job.job_id // empty' "$body")"
          if [[ -z "$job_id" ]]; then
            echo "refresh endpoint did not return a job id" >&2
            cat "$body" >&2 || true
            exit 1
          fi
          echo "refresh requested: job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: wait for refresh result
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer $FIN_API_ADMIN_TOKEN" \
              "$FIN_API_BASE_URL/admin/funds/refresh-snapshot/status?job_id=$JOB_ID")"
            status="$(echo "$response" | jq -r '.refresh_job.status // empty')"
            resolution="$(echo "$response" | jq -r '.refresh_job.resolution_status // empty')"
            as_of="$(echo "$response" | jq -r '.refresh_job.resolved_as_of // .refresh_job.as_of // empty')"
            snapshot_action="$(echo "$response" | jq -r '.refresh_job.snapshot_action // empty')"
            echo "refresh status: job_id=$JOB_ID status=$status resolution=${resolution:-unknown} action=${snapshot_action:-unknown} as_of=${as_of:-unknown}"
            case "$status" in
              succeeded)
                if [[ ! "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                  echo "refresh succeeded without a valid snapshot as_of date" >&2
                  exit 1
                fi
                as_of_epoch="$(date -u -d "$as_of" +%s)"
                now_epoch="$(date -u +%s)"
                max_age_seconds="$((FIN_MAX_SNAPSHOT_AGE_DAYS * 86400))"
                if (( now_epoch - as_of_epoch > max_age_seconds )); then
                  echo "refresh completed but snapshot is older than ${FIN_MAX_SNAPSHOT_AGE_DAYS} days: $as_of" >&2
                  exit 1
                fi
                case "$snapshot_action" in
                  updated|retained_current|retained_newer|retained_current_market_closed)
                    ;;
                  *)
                    echo "refresh completed without publishing a valid snapshot: action=${snapshot_action:-unknown}" >&2
                    exit 1
                    ;;
                esac
                echo "refresh succeeded: $resolution"
                exit 0
                ;;
              failed)
                echo "refresh failed: $resolution" >&2
                exit 1
                ;;
              superseded)
                echo "refresh was superseded by a newer generation; existing snapshot remains authoritative"
                exit 0
                ;;
            esac
            sleep 20
          done
          echo "refresh job did not finish within 30 minutes" >&2
          exit 1
