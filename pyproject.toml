[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfin"
version = "0.16.0"
description = "Local-first financial report assistant (RAG-Fin)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pypdf>=4.2.0",
  "pandas>=2.2.0",
  "PyYAML>=6.0.1",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "tefasfon>=1.1.0,<2",
  "redis>=5.0.0",
  "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
ragfin-api = "ragfin.api:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ragfin*", "app*"]
