name = "fin-assistant"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
FIN_API_BASE_URL = "https://grknsytrk-fin-api.hf.space"

[secrets]
required = ["FIN_API_ADMIN_TOKEN"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
