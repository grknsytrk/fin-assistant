name = "fin-assistant-dev"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
FIN_API_BASE_URL = "https://grknsytrk-fin-api.hf.space"
EDGE_CACHE_ENABLED = "false"

# The default configuration is used for local and preview development.
[cache]
enabled = false

[observability]
enabled = true
head_sampling_rate = 1
