name = "fin-assistant"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
workers_dev = true

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
FIN_API_BASE_URL = "https://grknsytrk-fin-api.hf.space"
EDGE_CACHE_ENABLED = "true"

[secrets]
required = ["FIN_API_ADMIN_TOKEN"]

[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Keep the gateway and all ordinary API traffic out of Workers Cache.
[cache]
enabled = false

# API forwarding remains uncached for all non-list routes.
[exports.ApiProxy]
type = "worker"

# Only this internal entrypoint handles cacheable public list responses.
[exports.CachedListApi]
type = "worker"

[exports.CachedListApi.cache]
enabled = true
